<!doctype html>
<html lang="zh-CN" data-page="dark" data-bg="graphite" data-grad="graphite" data-safe="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手信 · 应用图标方案</title>
<link rel="stylesheet" href="assets/mark-masks.css">
<style>
:root{
  --font:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --page:#0c0d10;--panel:#131418;--panel-2:#191a1f;--line:rgba(255,255,255,.08);
  --ink:#eceef2;--ink2:#c3c6cf;--muted:#8b8e99;
  --accent:#6ea8ff;--accent-soft:rgba(110,168,255,.14);
  color-scheme:dark;
}
html[data-page="light"]{
  --page:#eef0f4;--panel:#fff;--panel-2:#f5f6f9;--line:#e5e7ee;
  --ink:#171921;--ink2:#3c3f4a;--muted:#6c707c;
  --accent:#2563eb;--accent-soft:rgba(37,99,235,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0;padding:26px 22px 90px;min-height:100vh;
  font-family:var(--font);font-synthesis:none;color:var(--ink);
  background:
    radial-gradient(1000px 560px at 70% -8%,rgba(255,255,255,.05),transparent 60%),
    radial-gradient(800px 500px at 8% 110%,rgba(110,168,255,.05),transparent 60%),
    var(--page);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
code{font-family:ui-monospace,Consolas,monospace;font-size:.92em}

/* ---------- 图标基底与渐变 ---------- */
html[data-grad="literal"]{--g1:#fff;--g2:#000}
html[data-grad="graphite"]{--g1:#fff;--g2:#6b7078}
html[data-grad="steel"]{--g1:#f7f8fa;--g2:#4a4e57}
html[data-bg="graphite"]{--icon-bg:radial-gradient(120% 110% at 32% 0%,#26282e 0%,#16171b 48%,#0d0e11 100%)}
html[data-bg="black"]{--icon-bg:radial-gradient(120% 110% at 32% 0%,#15161a 0%,#08090b 55%,#000 100%)}

.icon{
  position:relative;overflow:hidden;background:var(--icon-bg);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 0 1px rgba(255,255,255,.04),0 14px 34px rgba(0,0,0,.42);
  flex:none;
}
.icon.big{width:176px;height:176px;border-radius:26%}
.icon.shape{width:52px;height:52px}
.icon.circle{border-radius:50%}
.icon.squircle{border-radius:26%}
.icon.rounded{border-radius:18%}
.icon.tiny{width:38px;height:38px;border-radius:26%}
.icon.shape,.icon.tiny{box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 5px 14px rgba(0,0,0,.32)}

.glyph{position:absolute;display:block;
  background:linear-gradient(180deg,var(--g1) 0%,var(--g2) 100%);
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;
  -webkit-mask-size:contain;mask-size:contain;
}
.g-mark{aspect-ratio:137/74}
.g-hand{aspect-ratio:46/74}
.g-sin{aspect-ratio:68/74}

.prompt{position:absolute;height:auto;overflow:visible}

/* 安全区 */
.safe{position:absolute;inset:0;display:none;pointer-events:none}
html[data-safe="on"] .icon.big .safe{display:block}
.safe::before{content:"";position:absolute;left:50%;top:50%;width:61.1%;aspect-ratio:1;
  transform:translate(-50%,-50%);border:1.5px dashed rgba(255,255,255,.38);border-radius:50%}
.safe::after{content:"safe 66dp";position:absolute;left:50%;bottom:4px;transform:translateX(-50%);
  font-size:8px;letter-spacing:.04em;color:rgba(255,255,255,.35);white-space:nowrap}

/* ---------- 页头 ---------- */
.head{max-width:1180px;margin:0 auto 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap}
.head h1{margin:0 0 6px;font-size:24px;letter-spacing:-.4px}
.head p{margin:0;font-size:12px;line-height:1.9;color:var(--muted);max-width:640px}
.controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ctl{display:flex;align-items:center;gap:8px}
.ctl .lbl{font-size:11px;color:var(--muted)}
.seg{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.seg button{height:30px;padding:0 12px;border-radius:999px;font-size:11px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.switch{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);cursor:pointer;user-select:none}
.switch input{appearance:none;width:32px;height:18px;border-radius:999px;background:var(--panel-2);
  border:1px solid var(--line);position:relative;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
  background:var(--muted);transition:transform .15s,background .15s}
.switch input:checked{background:var(--accent-soft);border-color:transparent}
.switch input:checked::after{transform:translateX(14px);background:var(--accent)}

/* ---------- 卡片 ---------- */
.grid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(296px,1fr));gap:16px}
.card{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:12px;
  cursor:pointer;outline:none;transition:border-color .15s,box-shadow .15s;position:relative}
.card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
.card:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.card[data-picked="1"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 10px 30px rgba(0,0,0,.18)}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;
  background:radial-gradient(120% 100% at 50% 0%,var(--panel-2),var(--panel));
  border:1px solid var(--line);border-radius:15px;padding:20px 12px 16px}
.shapes{display:flex;align-items:center;gap:9px}
.cap{display:flex;align-items:baseline;gap:8px;padding:12px 6px 4px;flex-wrap:wrap}
.cap b{font-size:12.5px;letter-spacing:-.1px}
.cap span{font-size:11px;color:var(--muted);line-height:1.5}
.pick{position:absolute;top:14px;right:14px;font-size:9px;font-weight:650;letter-spacing:.06em;
  padding:4px 9px;border-radius:999px;background:var(--accent);color:#0a0c10;opacity:0;transform:scale(.9);
  transition:opacity .15s,transform .15s;pointer-events:none}
.card[data-picked="1"] .pick{opacity:1;transform:scale(1)}
.note-row{max-width:1180px;margin:16px auto 0;font-size:11px;color:var(--muted);line-height:1.9}

/* 底部状态条 */
.bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:none;
  align-items:center;gap:10px;padding:9px 16px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 34px rgba(0,0,0,.35);
  font-size:12px;color:var(--ink2);white-space:nowrap;z-index:9}
.bar[data-show="1"]{display:flex}
.bar b{color:var(--accent)}

footer{max-width:1180px;margin:26px auto 0;font-size:11px;line-height:2;color:var(--muted)}
footer ul{margin:0;padding-left:16px}
</style>
</head>
<body>

<div class="head">
  <div>
    <h1>应用图标方案</h1>
    <p>用导航栏那枚甲骨文「手信」，搭配 Termux 的 <code>&gt;_</code>。渐变统一自上而下，默认白 → 石墨，
       可切到字面的白 → 黑。点卡片选中（或告诉我编号）；右侧圆/方圆/圆角是系统遮罩后的样子，38px 看小尺寸辨识度。</p>
  </div>
  <div class="controls">
    <div class="ctl">
      <span class="lbl">底色</span>
      <div class="seg" id="seg-bg">
        <button data-v="graphite" aria-pressed="true">石墨</button>
        <button data-v="black" aria-pressed="false">纯黑</button>
      </div>
    </div>
    <div class="ctl">
      <span class="lbl">渐变</span>
      <div class="seg" id="seg-grad">
        <button data-v="literal" aria-pressed="false">白→黑</button>
        <button data-v="graphite" aria-pressed="true">白→石墨</button>
        <button data-v="steel" aria-pressed="false">冷银</button>
      </div>
    </div>
    <div class="ctl">
      <span class="lbl">页面</span>
      <div class="seg" id="seg-page">
        <button data-v="dark" aria-pressed="true">深</button>
        <button data-v="light" aria-pressed="false">浅</button>
      </div>
    </div>
    <label class="switch"><input type="checkbox" id="safe-toggle"> 安全区</label>
  </div>
</div>

<main class="grid" id="grid"></main>

<p class="note-row" id="note-row"></p>

<footer>
  <ul>
    <li>自适应图标 108×108dp：虚线圆为 66dp 内容安全区，圆形遮罩下只有安全区内的笔画一定不会被裁。</li>
    <li>「白→黑」为字面效果；在纯黑底上底部会自然隐没。要保证底部笔画可读选「白→石墨」或「冷银」。</li>
    <li>页面里的甲骨文来自现有位图蒙版（137×74），放大略软；最终图标会按选定方案重画为矢量 + 渐变着色。</li>
  </ul>
</footer>

<div class="bar" id="bar">已选 <b id="bar-id"></b><span id="bar-name"></span></div>

<script>
'use strict';

/* ---------- 素材 ---------- */
const IMG = {
  mark: 'mk-mark',
  hand: 'mk-hand',
  sin:  'mk-sin'
};

let plainCount = 0;

function glyph(maskClass, style, cls) {
  return `<i class="glyph ${maskClass} ${cls}" style="${style}"></i>`;
}

/* 提示符 >_ ：chevron + 下划线，圆头，描边跟随渐变 */
function prompt(style, long) {
  const id = 'lg' + (++plainCount);
  const vb = long ? '0 0 120 72' : '0 0 100 72';
  const und = long ? 'M52 62h62' : 'M62 60h30';
  return `<svg class="prompt" viewBox="${vb}" style="${style}" aria-hidden="true">
    <defs><linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="72">
      <stop offset="0" style="stop-color:var(--g1)"/>
      <stop offset="1" style="stop-color:var(--g2)"/>
    </linearGradient></defs>
    <path d="M14 10 50 36 14 62" fill="none" stroke="url(#${id})" stroke-width="13"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${und}" fill="none" stroke="url(#${id})" stroke-width="13" stroke-linecap="round"/>
  </svg>`;
}

/* ---------- 九个版式 ---------- */
const VARIANTS = [
  {
    id: 'A', name: '上下式', desc: '手信在上，提示符在下，最稳的一组',
    art: () =>
      glyph(IMG.mark, 'left:50%;top:16%;width:62%;transform:translateX(-50%)', 'g-mark') +
      prompt('left:50%;bottom:11%;width:40%;transform:translateX(-50%)')
  },
  {
    id: 'B', name: '前后式', desc: '>_ 在左，手信在右，读作一条命令',
    art: () =>
      prompt('left:15.5%;top:50%;width:20%;transform:translateY(-50%)') +
      glyph(IMG.mark, 'left:38.5%;top:50%;width:46%;transform:translateY(-50%)', 'g-mark')
  },
  {
    id: 'C', name: '下划线式', desc: '>_ 拉成基线，托住手信',
    art: () =>
      glyph(IMG.mark, 'left:22%;top:20%;width:56%', 'g-mark') +
      prompt('left:20%;bottom:12%;width:60%', true)
  },
  {
    id: 'D', name: '角标式', desc: '手信为主，>_ 作右下角小注',
    art: () =>
      glyph(IMG.mark, 'left:19%;top:20%;width:62%', 'g-mark') +
      prompt('right:14%;bottom:14%;width:20%')
  },
  {
    id: 'E', name: '竖排式', desc: '手在上、信在下，像一方窄印',
    art: () =>
      glyph(IMG.hand, 'left:50%;top:10%;width:15%;transform:translateX(-50%)', 'g-hand') +
      glyph(IMG.sin,  'left:50%;top:40%;width:24%;transform:translateX(-50%)', 'g-sin') +
      prompt('left:50%;bottom:7%;width:30%;transform:translateX(-50%)')
  },
  {
    id: 'F', name: '方章式', desc: '手信收进软框，>_ 压在章底',
    art: () =>
      `<div class="seal" style="left:50%;top:15%;width:62%;aspect-ratio:1;transform:translateX(-50%)">
         ${glyph(IMG.mark, 'left:50%;top:15%;width:66%;transform:translateX(-50%)', 'g-mark')}
         ${prompt('left:50%;bottom:12%;width:42%;transform:translateX(-50%)')}
       </div>`
  },
  {
    id: 'G', name: '单手式', desc: '只取「手」，提示符垫在下方',
    art: () =>
      glyph(IMG.hand, 'left:50%;top:21%;width:24%;transform:translateX(-50%)', 'g-hand') +
      prompt('left:50%;bottom:16%;width:34%;transform:translateX(-50%)')
  },
  {
    id: 'H', name: '提示符在上', desc: '先命令、后名字，像终端回显',
    art: () =>
      prompt('left:50%;top:15%;width:30%;transform:translateX(-50%)') +
      glyph(IMG.mark, 'left:19%;top:42%;width:62%', 'g-mark')
  },
  {
    id: 'I', name: '极简式', desc: '只留手信，不加提示符',
    art: () =>
      glyph(IMG.mark, 'left:16%;top:50%;width:68%;transform:translateY(-50%)', 'g-mark')
  }
];

/* ---------- 渲染 ---------- */
function artOf(iconHtml, extra) {
  return iconHtml + (extra || '');
}

function cardHTML(v) {
  const art = v.art();
  return `
  <figure class="card" data-id="${v.id}" data-name="${v.name}" tabindex="0" role="button"
          aria-label="方案 ${v.id} ${v.name}：${v.desc}">
    <div class="stage">
      <div class="icon big">${artOf(art, '<div class="safe"></div>')}</div>
      <div class="shapes">
        <div class="icon shape circle">${artOf(art)}</div>
        <div class="icon shape squircle">${artOf(art)}</div>
        <div class="icon shape rounded">${artOf(art)}</div>
        <div class="icon tiny" title="38px">${artOf(art)}</div>
      </div>
    </div>
    <figcaption class="cap"><b>${v.id} · ${v.name}</b><span>${v.desc}</span></figcaption>
    <span class="pick">已选</span>
  </figure>`;
}

const grid = document.getElementById('grid');
const noteRow = document.getElementById('note-row');
grid.innerHTML = VARIANTS.map(cardHTML).join('');

const sealStyle = document.createElement('style');
sealStyle.textContent = `.seal{position:absolute;border-radius:19%;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -18px 30px rgba(0,0,0,.18);overflow:hidden}`;
document.head.appendChild(sealStyle);

/* ---------- 选择 ---------- */
const bar = document.getElementById('bar');
const barId = document.getElementById('bar-id');
const barName = document.getElementById('bar-name');
let picked = null;

function pick(card) {
  document.querySelectorAll('.card').forEach(c => c.dataset.picked = '0');
  if (!card) { bar.dataset.show = '0'; picked = null; return; }
  card.dataset.picked = '1';
  picked = card;
  barId.textContent = card.dataset.id;
  barName.textContent = '· ' + card.dataset.name;
  bar.dataset.show = '1';
  try { history.replaceState(null, '', '#' + card.dataset.id); } catch (e) {}
}

grid.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  pick(card === picked ? null : card);
});
grid.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest('.card');
  if (!card) return;
  e.preventDefault();
  pick(card === picked ? null : card);
});

/* ---------- 控件 ---------- */
function segment(id, attr, onChange) {
  const root = document.getElementById(id);
  root.addEventListener('click', e => {
    const btn = e.target.closest('button[data-v]');
    if (!btn) return;
    root.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    document.documentElement.setAttribute(attr, btn.dataset.v);
    onChange && onChange(btn.dataset.v);
  });
}

const GRAD_TEXT = {
  literal:  '当前渐变：白 → 纯黑（字面）。纯黑底上底部笔画会隐没，属于预期；若想保留底部细节，改「白→石墨」。',
  graphite: '当前渐变：白 → 石墨灰。底部仍保留轮廓，是三种里最稳的可读性方案。',
  steel:    '当前渐变：冷银。上端略带蓝调、下端压暗，介质感最强，但黑白对比最弱。'
};

function updateNote() {
  const g = document.documentElement.dataset.grad;
  noteRow.textContent = GRAD_TEXT[g];
}

segment('seg-bg', 'data-bg');
segment('seg-grad', 'data-grad', updateNote);
segment('seg-page', 'data-page');
updateNote();

document.getElementById('safe-toggle').addEventListener('change', e => {
  document.documentElement.dataset.safe = e.target.checked ? 'on' : 'off';
});

/* URL hash 回显已选 */
const fromHash = location.hash.replace('#', '');
if (fromHash) {
  const card = [...document.querySelectorAll('.card')].find(c => c.dataset.id === fromHash);
  if (card) pick(card);
}
</script>
</body>
</html>
