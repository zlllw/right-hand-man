<!doctype html>
<html lang="zh-CN" data-mode="light" data-theme="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>手信 RHM · 手机界面原型</title>
<style>
:root{--r-xs:8px;--r-sm:10px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-sheet:24px;--font:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;--mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;font-family:var(--font);font-synthesis:none}
html[data-mode="light"]{--bg:#f5f5f8;--surface:#ffffff;--surface-2:#f3f3f7;--ink:#1d1e26;--ink-2:#4b4d59;--muted:#7c7e8c;--faint:#a7a9b5;--line:#e8e8ef;--line-strong:#d8d9e2;--field:#f1f1f6;--page:radial-gradient(1100px 720px at 68% -12%,#ffffff 0%,#eceef4 52%,#e6e8ef 100%);--frame:#26262e;--scrim:rgba(23,24,34,.36);--shadow:0 24px 60px rgba(24,26,44,.10),0 3px 8px rgba(24,26,44,.06);--toolbar-bg:rgba(255,255,255,.84);--toolbar-ring:rgba(24,26,44,.10);--toast-bg:rgba(28,29,38,.92);--toast-ink:#f5f5fa;--tool-bg:#fafafd;--term-bg:#1e1f26;--term-ink:#c9cad6;--term-dim:#8c8ea0;--term-line:rgba(255,255,255,.08);--ok:#1b7a5f;--danger:#b23f49;--glyph-bg:#eeedf6;--glyph-ink:#6f66a8;--glyph-csv-bg:#e6f3ea;--glyph-csv-ink:#4c8a61;--glyph-img-bg:#e9effa;--glyph-img-ink:#5b7cb8;--glass-bg:rgba(255,255,255,.72);--glass-line:rgba(24,26,44,.08);--glass-shadow:0 10px 30px rgba(24,26,44,.12);color-scheme:light}
html[data-mode="dark"]{--bg:#0f0f13;--surface:#17171c;--surface-2:#1f1f26;--ink:#ededf2;--ink-2:#c2c3ce;--muted:#8f91a0;--faint:#63656f;--line:#26262f;--line-strong:#33343f;--field:#1d1d24;--page:radial-gradient(1100px 720px at 68% -12%,#18181f 0%,#0d0d11 55%,#0a0a0d 100%);--frame:#3a3b46;--scrim:rgba(0,0,0,.6);--shadow:0 24px 70px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.4);--toolbar-bg:rgba(22,22,28,.85);--toolbar-ring:rgba(0,0,0,.5);--toast-bg:rgba(238,238,244,.94);--toast-ink:#17171c;--tool-bg:#1b1b21;--term-bg:#191a20;--term-ink:#c9cad6;--term-dim:#84879a;--term-line:rgba(255,255,255,.07);--ok:#63d3a9;--danger:#f0909a;--glyph-bg:#262435;--glyph-ink:#b7b0ea;--glyph-csv-bg:#1e3226;--glyph-csv-ink:#7fc79b;--glyph-img-bg:#222a3c;--glyph-img-ink:#8fb0e8;--glass-bg:rgba(30,30,38,.66);--glass-line:rgba(255,255,255,.08);--glass-shadow:0 10px 30px rgba(0,0,0,.45);color-scheme:dark}
html[data-theme="blue"]{--accent:#2563eb;--accent-ink:#ffffff;--accent-soft:#e8f0fe;--accent-soft-ink:#1d4ed8;--accent-line:#bfd4f7;--accent-bright:#6ea8ff}
html[data-mode="dark"][data-theme="blue"]{--accent:#6ea8ff;--accent-ink:#0b1b33;--accent-soft:#16263d;--accent-soft-ink:#bbd4ff;--accent-line:#2c4468;--accent-bright:#6ea8ff}
html[data-theme="teal"]{--accent:#0e7c6b;--accent-ink:#ffffff;--accent-soft:#e3f3ef;--accent-soft-ink:#0b5f52;--accent-line:#bde3da;--accent-bright:#5fd3c0}
html[data-mode="dark"][data-theme="teal"]{--accent:#5fd3c0;--accent-ink:#08221d;--accent-soft:#17332e;--accent-soft-ink:#a9e8dc;--accent-line:#28514a;--accent-bright:#5fd3c0}
html[data-theme="clay"]{--accent:#b4582a;--accent-ink:#ffffff;--accent-soft:#f8ece3;--accent-soft-ink:#8e4520;--accent-line:#eccdb8;--accent-bright:#e89b6d}
html[data-mode="dark"][data-theme="clay"]{--accent:#e89b6d;--accent-ink:#2b170c;--accent-soft:#38271c;--accent-soft-ink:#f3c4a3;--accent-line:#5a3d2a;--accent-bright:#e89b6d}
html[data-theme="graphite"]{--accent:#35373f;--accent-ink:#ffffff;--accent-soft:#eaeaf0;--accent-soft-ink:#33353d;--accent-line:#ced0da;--accent-bright:#dadce6}
html[data-mode="dark"][data-theme="graphite"]{--accent:#dadce6;--accent-ink:#17181d;--accent-soft:#2a2b33;--accent-soft-ink:#e4e5ec;--accent-line:#41434e;--accent-bright:#dadce6}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0;color:inherit;background:none}
button:disabled{cursor:default;opacity:.45}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input,textarea{-webkit-tap-highlight-color:transparent}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
button svg{pointer-events:none}
[hidden]{display:none!important}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:22px 26px}
.toolbar{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px;background:var(--toolbar-bg);border:1px solid var(--line);border-radius:999px;box-shadow:0 10px 32px var(--toolbar-ring);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:100}
.seg{display:flex;gap:2px}
.seg button{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.seg button svg{width:17px;height:17px}
.seg button:hover{background:var(--surface-2);color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-soft-ink)}
.toolbar-divider{width:1px;height:18px;background:var(--line)}
.swatches{display:flex;align-items:center;gap:7px;padding:0 7px 0 2px}
.swatch{width:19px;height:19px;border-radius:999px;border:0;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swatch[data-theme="blue"]{background:#2563eb}
.swatch[data-theme="teal"]{background:#0e7c6b}
.swatch[data-theme="clay"]{background:#b4582a}
.swatch[data-theme="graphite"]{background:#35373f}
html[data-mode="dark"] .swatch[data-theme="blue"]{background:#6ea8ff}
html[data-mode="dark"] .swatch[data-theme="teal"]{background:#5fd3c0}
html[data-mode="dark"] .swatch[data-theme="clay"]{background:#e89b6d}
html[data-mode="dark"] .swatch[data-theme="graphite"]{background:#dadce6}
.swatch[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.device-wrap{position:relative;flex:none}
.device{width:390px;height:min(830px,calc(100vh - 76px));min-height:600px;border:7px solid var(--frame);border-radius:44px;background:var(--surface);position:relative;overflow:hidden;box-shadow:var(--shadow)}
.phone{height:100%;position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}
.status{height:31px;padding:11px 22px 0;display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:700;flex-shrink:0;color:var(--ink)}
.status-right{display:flex;align-items:center;gap:5px}
.status svg{width:13px;height:13px;stroke-width:2}
.battery{width:19px;height:9px;border:1px solid currentColor;border-radius:2.5px;padding:1px;position:relative}
.battery:before{content:"";display:block;height:100%;width:80%;background:currentColor;border-radius:1px}
.battery:after{content:"";position:absolute;right:-3px;top:2px;height:3px;border-right:2px solid currentColor}
.app-header{height:56px;display:flex;align-items:center;gap:6px;padding:4px 8px;margin:4px 12px 6px;border:1px solid var(--glass-line);border-radius:18px;background:var(--glass-bg);box-shadow:0 4px 16px rgba(0,0,0,.06);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);flex-shrink:0;position:relative;z-index:5}
.app-header .icon-btn{width:32px;height:32px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;color:var(--ink-2)}
.app-header .icon-btn:hover{border-color:var(--accent-line);color:var(--ink)}
.app-header .header-new{color:var(--accent)}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:var(--r-md);flex-shrink:0;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2)}
.app-name{flex:1;min-width:0;padding:0 4px}
.app-name strong{font-size:13px;font-weight:500;letter-spacing:.2px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.header-new{color:var(--accent)}
.workspace-btn{position:relative}
.chat-view{display:flex;flex-direction:column;flex:1;min-height:0}
.messages{flex:1;overflow:auto;padding:20px 19px 8px;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(to bottom,transparent 0,rgba(0,0,0,.35) 10px,#000 28px);mask-image:linear-gradient(to bottom,transparent 0,rgba(0,0,0,.35) 10px,#000 28px)}
.time-label{font-size:11px;color:var(--faint);text-align:center;margin:0 0 19px}
.message{margin-bottom:20px}
.message.user{display:flex;align-items:flex-end;flex-direction:column}
.bubble{max-width:94%;font-size:15px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}
.user .bubble{background:var(--accent-soft);padding:12px 15px;border-radius:var(--r-lg) var(--r-lg) 6px var(--r-lg);color:var(--accent-soft-ink)}
.assistant .bubble{padding-left:0;color:var(--ink)}
.assistant-label{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-bottom:8px}
.mini-brand{width:20px;height:20px;display:grid;place-items:center;border-radius:6px;color:var(--accent-soft-ink);background:var(--accent-soft);font:bold 10px var(--mono)}
.file-card{display:flex;align-items:center;gap:10px;width:246px;max-width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);margin-bottom:8px;text-align:left}
.file-card:hover{border-color:var(--accent-line)}
.file-glyph{height:34px;width:30px;border-radius:var(--r-xs);background:var(--glyph-bg);color:var(--glyph-ink);font:700 9px var(--mono);display:grid;place-items:center;flex-shrink:0}
.file-glyph.csv{background:var(--glyph-csv-bg);color:var(--glyph-csv-ink)}
.file-glyph.png,.file-glyph.jpg,.file-glyph.webp,.file-glyph.gif{background:var(--glyph-img-bg);color:var(--glyph-img-ink)}
.file-copy{flex:1;min-width:0}
.file-copy strong{font-size:12px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-copy small{font-size:9px;color:var(--muted);margin-top:4px;display:block}
.file-card>svg{width:15px;color:var(--faint)}
.tool{margin:10px 0 12px;border:1px solid var(--line);border-radius:var(--r-md);font-size:11px;background:var(--tool-bg);overflow:hidden}
.tool summary{display:flex;align-items:center;gap:7px;cursor:pointer;padding:10px;list-style:none;color:var(--ink-2)}
.tool summary::-webkit-details-marker{display:none}
.tool summary svg{width:14px;height:14px;color:var(--ok)}
.tool summary span{margin-left:auto;font-size:9px;color:var(--ok)}
.tool pre{margin:0;padding:0 11px 11px;font-size:10px;color:var(--muted);line-height:1.8;white-space:pre-wrap}
.message-actions{display:flex;gap:7px;margin:9px 0 0}
.message-actions button{color:var(--faint);padding:3px}
.message-actions button:hover{color:var(--ink-2)}
.message-actions svg{width:13px;height:13px}
.new-state{padding:43px 7px 0}
.new-state .welcome-logo{width:45px;height:45px;border-radius:var(--r-lg);background:var(--accent-soft);color:var(--accent-soft-ink);display:grid;place-items:center;font:bold 20px var(--mono);margin-bottom:19px}
.new-state h3{font-size:22px;line-height:1.5;margin:0 0 8px;letter-spacing:-.4px;color:var(--ink)}
.new-state p{font-size:14px;color:var(--muted);line-height:1.9;margin:0}
.suggestions{display:grid;gap:8px;margin-top:25px}
.suggestions button{border:1px solid var(--line);border-radius:var(--r-md);padding:12px;text-align:left;font-size:13px;display:flex;align-items:center;gap:9px;color:var(--ink-2)}
.suggestions button:hover{background:var(--surface-2)}
.suggestions svg{width:16px;color:var(--accent)}
.composer-area{padding:9px 15px 11px;background:var(--surface);flex-shrink:0}
.pending-files{display:flex;overflow-x:auto;gap:6px;padding-bottom:7px}
.pending-file{display:flex;align-items:center;gap:5px;font-size:11px;border:1px solid var(--line);border-radius:var(--r-xs);padding:7px;background:var(--surface-2);max-width:230px;flex-shrink:0}
.pending-file>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.pending-file svg{width:12px;height:12px;color:var(--accent)}
.pending-file button{font-size:14px;color:var(--muted);padding:0 2px}
.compose-box{background:var(--field);border:1px solid var(--line);border-radius:var(--r-lg);padding:11px 12px 8px;transition:border-color .15s}
.compose-box:focus-within{border-color:var(--accent-line)}
.compose-box textarea{background:transparent;border:0;resize:none;width:100%;min-height:33px;max-height:88px;outline:none;color:var(--ink);font-size:15px;line-height:1.6;padding:1px 0 7px}
.compose-box textarea::placeholder{color:var(--faint)}
.compose-bottom{display:flex;gap:7px;align-items:center}
.attach-button{width:30px;height:30px;border-radius:var(--r-xs);display:grid;place-items:center;color:var(--muted)}
.attach-button:hover{background:var(--surface-2);color:var(--ink-2)}
.attach-button svg{width:21px;height:21px}
.model-badge{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.model-badge .dot{width:5px;height:5px;border-radius:100%;background:var(--accent)}
.send{width:34px;height:34px;border-radius:var(--r-sm);background:var(--accent);color:var(--accent-ink);margin-left:auto;display:grid;place-items:center}
.send svg{width:17px;height:17px}
.send:disabled{background:var(--line-strong);color:var(--surface);opacity:1}
.bottom-nav{display:flex;align-items:center;justify-content:center;gap:4px;flex-shrink:0;margin:6px auto 8px;padding:5px;border-radius:22px;background:var(--glass-bg);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);width:max-content}

.dock-divider{width:1px;height:22px;background:var(--line);margin:0 2px}
.bottom-nav button{width:54px;height:44px;border-radius:16px;display:grid;place-items:center;color:var(--muted);background:transparent;border:0;box-shadow:none}
.bottom-nav button:hover{background:var(--surface-2)}
.bottom-nav button svg{width:20px;height:20px}
.bottom-nav .active{color:var(--accent);background:var(--accent-soft)}
.homebar{height:13px;flex-shrink:0;display:flex;justify-content:center;padding-top:4px}
.homebar:before{content:"";width:106px;height:3px;border-radius:9px;background:var(--line-strong)}
.overlay{position:absolute;inset:0;z-index:10;background:var(--scrim);display:flex}
.drawer{width:87%;height:100%;background:var(--surface);display:flex;flex-direction:column;padding:44px 18px 20px;animation:slidein .2s ease-out}
.drawer-header{display:flex;align-items:center;gap:9px}
.drawer-header strong{font-size:20px}
.drawer-header .icon-btn{margin-left:auto;color:var(--muted)}
.primary{background:var(--accent);color:var(--accent-ink);border-radius:var(--r-md);padding:12px 14px;font-size:12px;font-weight:550;display:flex;align-items:center;justify-content:center;gap:8px}
.primary svg{width:16px;height:16px}
.search-box{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 11px;background:var(--field);margin:16px 0 12px}
.search-box svg{width:14px;color:var(--faint)}
.search-box input{width:100%;border:0;outline:none;background:none;font-size:14px;min-width:0;color:var(--ink)}
.search-box input::placeholder{color:var(--faint)}
.history-list{overflow:auto;flex:1;min-height:0;margin:0 -6px;padding:0 6px;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.history-group{font-size:11px;color:var(--faint);margin:16px 9px 8px}
.swipe-row{position:relative;border-radius:var(--r-md);overflow:hidden;margin-bottom:4px;touch-action:pan-y}
.swipe-actions{position:absolute;inset:0 0 0 auto;display:flex}
.swipe-action{width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#fff;font-size:11px;font-weight:550;user-select:none;-webkit-user-select:none}
.swipe-action svg{width:15px;height:15px}
.swipe-action.rename{background:#2f78f0}
.swipe-action.pin{background:#e89a3c}
.swipe-action.del{background:#d9534f}
.history-item{width:100%;text-align:left;border-radius:var(--r-md);padding:12px 10px;display:flex;align-items:center;gap:8px;color:var(--ink-2);position:relative;z-index:1;background:var(--surface);transition:transform .18s ease;user-select:none;-webkit-user-select:none}
.swipe-row.dragging .history-item{transition:none}
.swipe-row.open .history-item{transform:translateX(-186px)}
.history-item:hover{background:var(--surface-2)}
.history-item.active{background:var(--accent-soft);color:var(--accent-soft-ink)}
.history-item>svg{width:15px;height:15px;color:var(--faint)}
.history-item.active>svg{color:var(--accent-soft-ink)}
.history-item .hist-info{flex:1;min-width:0}
.history-item strong{font-size:14px;font-weight:550;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-item small{font-size:11px;color:var(--muted);display:block;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-item.active small{color:var(--accent-soft-ink);opacity:.72}
.history-item .live-dot{width:5px;height:5px;border-radius:100%;background:var(--accent)}
.empty-result{font-size:13px;line-height:1.8;color:var(--muted);text-align:center;padding:30px 10px}
.drawer-foot{padding-top:10px;border-top:1px solid var(--line);margin-top:10px;display:flex}
.drawer-settings{width:52px;height:52px;border-radius:var(--r-lg);display:grid;place-items:center;font-size:11px;font-weight:550;color:var(--ink-2);background:var(--surface-2)}
.drawer-settings:hover{background:var(--accent-soft);color:var(--accent-soft-ink)}
.drawer-settings svg{width:21px;height:21px}
.settings-group{margin-bottom:6px}
.sheet.settings-sheet{min-height:64%}
.settings-label{font-size:11px;color:var(--faint);letter-spacing:.5px;margin:12px 2px 4px}
.settings-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.settings-row:last-child{border-bottom:0}
.settings-row>div:first-child{flex:1;min-width:0}
.settings-row strong{font-size:14px;font-weight:550;display:block}
.settings-row small{font-size:11px;color:var(--muted);display:block;margin-top:3px}
.settings-value{font-size:12px;color:var(--muted)}
.settings-value.mono{font-family:var(--mono)}
.settings-row .seg{gap:4px}
.settings-row .seg button{width:30px;height:30px;border:1px solid var(--line)}
.settings-row .seg button[aria-pressed="true"]{border-color:var(--accent-line)}
.settings-row .swatches{gap:8px;padding:0}
.settings-row .swatch{width:22px;height:22px}
.sheet-overlay{align-items:flex-end}
.sheet{background:var(--surface);max-height:86%;width:100%;border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:9px 19px 22px;display:flex;flex-direction:column;animation:slideup .2s ease-out;min-height:0}
.grabber{height:4px;width:33px;border-radius:4px;background:var(--line-strong);margin:0 auto 14px;flex-shrink:0}
.sheet-title{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-shrink:0}
.sheet-title h3{font-size:18px;margin:0;flex:1}
.sheet-title .icon-btn{height:30px;width:30px;color:var(--muted)}
.sheet-title svg{width:18px}
.sheet-text{font-size:12px;color:var(--muted);line-height:1.8;margin:0 0 16px}
.sheet-scroll{overflow:auto;min-height:0}
.sheet-action{display:flex;align-items:center;gap:12px;padding:14px 3px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.sheet-action:hover{background:var(--surface-2)}
.action-icon{height:34px;width:34px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--accent-soft-ink);display:grid;place-items:center}
.action-icon svg{width:17px}
.sheet-action strong{font-size:12px;display:block;font-weight:550}
.sheet-action small{font-size:9px;color:var(--muted);display:block;margin-top:5px}
.sheet-action>svg{margin-left:auto;width:14px;color:var(--faint)}
.privacy{font-size:9px;line-height:1.9;color:var(--muted);background:var(--surface-2);padding:11px;border-radius:var(--r-sm);margin:15px 0 0}
.directory-path{padding:10px 11px;background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);font-size:10px;font-family:var(--mono);color:var(--ink-2);display:flex;align-items:center;gap:8px}
.directory-path button{margin-left:auto;color:var(--accent);display:flex}
.directory-path svg{width:13px;height:13px}
.file-list{margin:8px 0 14px}
.file-row{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.file-main{display:flex;gap:10px;align-items:center;min-width:0;flex:1;text-align:left;padding:0}
.file-row .icon-btn{width:27px;height:27px;color:var(--accent)}
.file-row .icon-btn svg{width:16px;height:16px}
.file-row .file-copy small{font-size:9px}
.sheet .primary{width:100%;flex-shrink:0}
.sheet-buttons{display:flex;gap:8px;padding-top:13px;flex-shrink:0}
.secondary{padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-md);font-size:11px;flex:1;color:var(--ink-2)}
.secondary:hover{background:var(--surface-2)}
.sheet-buttons .primary{flex:1;width:auto}
.preview-content{background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px;font-size:11px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;max-height:270px;overflow:auto;margin:12px 0;color:var(--ink-2)}
.preview-image{max-width:100%;max-height:260px;object-fit:contain;border-radius:var(--r-sm);display:block;margin:12px auto}
.rename-input{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;font-size:15px;width:100%;background:var(--field);color:var(--ink);outline:none}
.rename-input:focus{border-color:var(--accent-line)}
.danger{color:var(--danger)}
.tab-terminal{flex:1;min-height:0;display:flex;flex-direction:column;margin:0 15px 12px;border-radius:var(--r-lg);background:var(--term-bg);color:var(--term-ink);overflow:hidden}
.terminal-title{font:10px var(--mono);padding:13px 14px;border-bottom:1px solid var(--term-line);display:flex;justify-content:space-between}
.terminal-title span{color:var(--term-dim)}
.terminal-body{padding:14px;overflow:auto;flex:1;font:11px/1.9 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.terminal-body .prompt{color:var(--accent-bright)}
.terminal-caption{padding:13px;font-size:9px;line-height:1.8;color:var(--term-dim);border-top:1px solid var(--term-line)}
.toast{position:absolute;bottom:105px;left:50%;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-ink);font-size:10px;line-height:1.7;padding:9px 14px;border-radius:var(--r-md);max-width:86%;width:max-content;text-align:center;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.loading-dot{display:inline-block;animation:pulse 1s infinite;color:var(--accent)}
.device-label{text-align:center;font-size:10px;letter-spacing:1px;color:var(--faint)}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0)}
@keyframes slidein{from{transform:translateX(-100%)}to{transform:translateX(0)}}
@keyframes slideup{from{transform:translateY(25px);opacity:.6}to{transform:translateY(0);opacity:1}}
@keyframes pulse{50%{opacity:.35}}
@media(max-width:700px){.stage{padding:64px 0 0;min-height:100dvh;display:block}.toolbar{top:10px}.device-wrap{width:100%}.device{width:100%;height:calc(100dvh - 64px);min-height:0;max-height:none;border:0;border-radius:0;box-shadow:none}.status{padding-top:9px;height:27px}.homebar{height:max(13px,env(safe-area-inset-bottom))}.app-header{height:56px;margin:4px 10px 6px}.messages{padding-left:20px;padding-right:20px}.composer-area{padding-bottom:9px}.bottom-nav{margin:6px auto 10px}.drawer{padding-top:35px}.new-state{padding-top:50px}.bubble{font-size:13px}.device-label{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
</style>

<body>
<div class="stage">
<div class="toolbar" role="group" aria-label="外观设置">
  <div class="seg" id="mode-seg" role="group" aria-label="颜色模式">
    <button data-mode="light" aria-label="浅色模式" aria-pressed="false"><span data-icon="sun"></span></button>
    <button data-mode="dark" aria-label="深色模式" aria-pressed="false"><span data-icon="moon"></span></button>
    <button data-mode="system" aria-label="跟随系统" aria-pressed="false"><span data-icon="monitor"></span></button>
  </div>
  <span class="toolbar-divider" aria-hidden="true"></span>
  <div class="swatches" id="theme-swatches" role="group" aria-label="主题色">
    <button class="swatch" data-theme="blue" aria-label="科技蓝主题" aria-pressed="false"></button>
    <button class="swatch" data-theme="teal" aria-label="松绿主题" aria-pressed="false"></button>
    <button class="swatch" data-theme="clay" aria-label="赭陶主题" aria-pressed="false"></button>
    <button class="swatch" data-theme="graphite" aria-label="石墨主题" aria-pressed="false"></button>
  </div>
</div>
<div class="device-wrap">
<div class="device"><main class="phone" id="phone" aria-label="手信手机交互原型">
  <div class="status" aria-hidden="true"><span>9:41</span><span class="status-right"><span data-icon="signal"></span><span data-icon="wifi"></span><span class="battery"></span></span></div>
  <header class="app-header"><button class="icon-btn" data-action="history" aria-label="打开历史侧边栏"><span data-icon="menu"></span></button><div class="app-name"><strong id="conversation-title"></strong></div><button class="icon-btn workspace-btn" data-action="files" aria-label="打开 rhmdir 文件夹"><span data-icon="folder"></span></button><button class="icon-btn header-new" data-action="new" aria-label="新建对话"><span data-icon="edit"></span></button></header>
  <section class="chat-view" id="chat-view" aria-label="聊天">
    <div class="messages" id="messages" role="log" aria-live="polite" aria-label="对话消息"></div>
    <div class="composer-area"><div class="pending-files" id="pending-files" aria-label="待发送附件"></div><form class="compose-box" id="composer"><label class="sr-only" for="message-input">消息</label><textarea id="message-input" rows="1" placeholder="发消息…" maxlength="4000"></textarea><div class="compose-bottom"><button type="button" class="attach-button" data-action="attach" aria-label="添加附件"><span data-icon="plus"></span></button><span class="model-badge"><span class="dot"></span> opencode</span><button class="send" type="submit" id="send-button" aria-label="发送消息"><span data-icon="up"></span></button></div></form></div>
  </section>
  <section class="tab-terminal" id="terminal-view" hidden aria-label="终端预览"><div class="terminal-title">bash <span>~/rhmdir</span></div><div class="terminal-body" id="terminal-content"></div><div class="terminal-caption">聊天与终端共用同一个 ~/rhmdir。</div></section>
  <nav class="bottom-nav" aria-label="主导航"><span class="dock-brand" aria-hidden="true"><span class="dock-mark"></span></span><span class="dock-divider" aria-hidden="true"></span><button class="active" id="nav-chat" data-action="chat" aria-current="page" aria-label="对话"><span data-icon="chat"></span></button><button id="nav-terminal" data-action="terminal" aria-label="终端"><span data-icon="terminal"></span></button></nav><div class="homebar" aria-hidden="true"></div>
  <div id="overlay-root"></div><div class="toast" id="toast" role="status" hidden></div>
  <input type="file" id="file-input" multiple hidden aria-label="从设备选择文件">
</main></div><div class="device-label">样式原型 · 数据仅保存在本页</div>
</div>
</div>

  pin:'<path d="M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>',

  wifi:'<path d="M3.8 8.6a13.6 13.6 0 0 1 16.4 0M6.7 12.3a9 9 0 0 1 10.6 0M9.6 15.9a4.4 4.4 0 0 1 4.8 0M12 19.4h.01"/>'
};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.file}</svg>`;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`;
const bytes=n=>n>=1048576?`${(n/1048576).toFixed(1)} MB`:n>=1024?`${(n/1024).toFixed(1)} KB`:`${n} B`;
let files=[],sessions=[],activeId='',tab='chat',uploadTo=null,toastTimer,overlayReturn=null,objectUrls=[];
const jobs=new Map();
const active=()=>sessions.find(s=>s.id===activeId);
const findFile=id=>files.find(f=>f.id===id);
function hydrateIcons(root=document){root.querySelectorAll('[data-icon]').forEach(el=>{el.innerHTML=icon(el.dataset.icon);});}

/* 外观：模式与主题色，localStorage 记忆，默认跟随系统 */
const appearance={mode:localStorage.getItem('rhm.mode')||'system',theme:localStorage.getItem('rhm.theme')||'graphite'};
const darkQuery=matchMedia('(prefers-color-scheme: dark)');
function applyAppearance(){
  const resolved=appearance.mode==='system'?(darkQuery.matches?'dark':'light'):appearance.mode;
  document.documentElement.dataset.mode=resolved;
  document.documentElement.dataset.theme=appearance.theme;
  document.documentElement.style.colorScheme=resolved;
  document.querySelectorAll('button[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===appearance.mode)));
  document.querySelectorAll('button[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===appearance.theme)));
}
darkQuery.addEventListener?.('change',()=>{if(appearance.mode==='system')applyAppearance();});
document.querySelectorAll('#mode-seg [data-mode]').forEach(b=>b.addEventListener('click',()=>{appearance.mode=b.dataset.mode;localStorage.setItem('rhm.mode',appearance.mode);applyAppearance();}));
document.querySelectorAll('#theme-swatches [data-theme]').forEach(b=>b.addEventListener('click',()=>{appearance.theme=b.dataset.theme;localStorage.setItem('rhm.theme',appearance.theme);applyAppearance();}));

function seed(){
  jobs.forEach(j=>clearInterval(j.timer));jobs.clear();objectUrls.forEach(u=>URL.revokeObjectURL(u));objectUrls=[];
  files=[{id:'f1',name:'需求说明.md',size:2458,type:'text/markdown',ready:true,source:'示例文件',content:'# 手信 · 文件与历史\n\n## 文件工作区\n用户上传的文件统一放到 ~/rhmdir。\n用户与 Agent 共享同一份文件。\n\n## 聊天历史\n左上角打开历史侧边栏。\n读取 opencode 的会话记录，支持继续聊天。\n\n## 交付顺序\n先确认手机界面原型，再实现 Android 功能。'},
  {id:'f2',name:'本周任务.csv',size:1204,type:'text/csv',ready:true,source:'示例文件',content:'任务,状态,优先级\n手机界面原型,进行中,P0\n文件上传到 rhmdir,待开发,P1\n读取 opencode 历史,待开发,P1\n终端嵌入,待开发,P2'},
  {id:'f3',name:'阅读笔记.txt',size:856,type:'text/plain',ready:true,source:'示例文件',content:'让手机上的聊天，成为本地 Agent 的入口。\n\n文件不必藏在某一段聊天里。\n历史不必重新搭建一个存储系统。\n\n先把流程讲清楚，再把体验做好。'}];
  sessions=[{id:'s1',title:'整理本周的项目资料',group:'今天',time:'刚刚',draft:'',pending:[],pinned:true,messages:[{role:'user',text:'帮我看看这份需求，整理下接下来要做的事。',files:['f1']},{role:'assistant',text:'看完了。文件和历史两条线都能先做，顺序是：先定手机界面，再补上传和历史。',tool:true},{role:'assistant',text:'两件事先落地：\n\n1. 文件统一放 ~/rhmdir，聊天和终端共用一份。\n2. 接上 opencode 的历史，不用另建存储。\n\n其他资料随时附在下一条消息里。'}]},
  {id:'s2',title:'分析本周任务清单',group:'今天',time:'10:28',draft:'',pending:[],pinned:false,messages:[{role:'user',text:'看看这周的安排。',files:['f2']},{role:'assistant',text:'原型确认是当前最优先的。文件上传、历史列表、终端嵌入按这个顺序做就行。\n\n从历史里恢复的对话，可以直接接着输入。'}]},
  {id:'s3',title:'搭建我的 Termux 工作环境',group:'昨天',time:'昨天',draft:'',pending:[],pinned:false,messages:[{role:'user',text:'想把手机变成随手能用的工作台。'},{role:'assistant',text:'工作目录就固定在 ~/rhmdir：聊天里上传的文件都落到这里，终端里也是同一个目录。'}]},
  {id:'s4',title:'关于聊天历史的几个想法',group:'过去 7 天',time:'11月18日',draft:'',pending:[],pinned:false,messages:[{role:'user',text:'聊天记录还要再存一份吗？'},{role:'assistant',text:'不用。直接用 opencode 自己的会话记录，RHM 通过 Bridge 读取，不另存副本，也不改它的数据库。'}]},
  {id:'s5',title:'整理课程阅读笔记',group:'过去 7 天',time:'11月17日',draft:'',pending:[],pinned:false,messages:[{role:'user',text:'这份笔记的重点是什么？',files:['f3']},{role:'assistant',text:'就一句话：文件可见、历史可续、聊天和终端用同一个目录。'}]}];
  activeId='s1';tab='chat';closeOverlay(false);render(true);
}
function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3200);}
function fileGlyph(f){const ext=f.name.split('.').pop().toLowerCase();return `<span class="file-glyph ${['csv','png','jpg','webp','gif'].includes(ext)?ext:''}">${esc(ext.slice(0,4).toUpperCase())}</span>`;}
function fileCard(id){const f=findFile(id);if(!f)return '';return `<button class="file-card" data-action="preview" data-id="${esc(id)}">${fileGlyph(f)}<span class="file-copy"><strong>${esc(f.name)}</strong><small>${bytes(f.size)} · rhmdir · ${esc(f.source)}</small></span>${icon('arrow')}</button>`;}
function renderMessages(scroll){const s=active();if(!s)return;const box=$('messages');
  if(!s.messages.length){box.innerHTML=`<div class="new-state"><div class="welcome-logo">&gt;_</div><h3>说点什么，或者带上文件。</h3><p>上传的文件放进 ~/rhmdir，<br>终端里也能直接用。</p><div class="suggestions"><button data-action="files">${icon('folder')}看看工作区里的文件</button><button data-action="attach">${icon('upload')}上传一份资料</button><button data-action="suggest">${icon('chat')}规划一下今天的任务</button></div></div>`;return;}
  box.innerHTML=`<div class="time-label">${esc(s.group)} · ${esc(s.time)}</div>`+s.messages.map((m,i)=>`<article class="message ${m.role}">${m.role==='assistant'?'<div class="assistant-label"><span class="mini-brand">&gt;_</span> opencode</div>':''}${(m.files||[]).map(fileCard).join('')}<div class="bubble">${esc(m.text)}${m.streaming?'<span class="loading-dot"> ▍</span>':''}</div>${m.tool?`<details class="tool"><summary>${icon('check')}读取 ~/rhmdir/需求说明.md<span>已完成</span></summary><pre>$ ls ~/rhmdir\n需求说明.md   本周任务.csv   阅读笔记.txt</pre></details>`:''}${m.role==='assistant'&&!m.streaming?`<div class="message-actions"><button data-action="copy-message" data-index="${i}" aria-label="复制回复">${icon('copy')}</button></div>`:''}</article>`).join('');
  if(scroll)box.scrollTop=box.scrollHeight;
}
function renderComposer(){const s=active();$('message-input').value=s.draft;$('pending-files').innerHTML=s.pending.map(id=>{const f=findFile(id);return f?`<div class="pending-file">${icon(f.ready?'file':'clock')}<span>${esc(f.name)}${f.ready?'':' · 上传中'}</span><button data-action="detach" data-id="${esc(f.id)}" aria-label="移除附件 ${esc(f.name)}">×</button></div>`:'';}).join('');$('pending-files').hidden=!s.pending.length;const streaming=jobs.has(s.id);$('send-button').innerHTML=icon(streaming?'stop':'up');$('send-button').setAttribute('aria-label',streaming?'停止回复':'发送消息');$('send-button').disabled=!streaming&&(!s.draft.trim()&&!s.pending.length||s.pending.some(id=>!findFile(id)?.ready));}
function render(scroll=false){const s=active();$('conversation-title').textContent=s.title;$('chat-view').hidden=tab!=='chat';$('terminal-view').hidden=tab!=='terminal';$('nav-chat').classList.toggle('active',tab==='chat');$('nav-terminal').classList.toggle('active',tab==='terminal');$('nav-chat').setAttribute('aria-current',tab==='chat'?'page':'false');$('nav-terminal').setAttribute('aria-current',tab==='terminal'?'page':'false');renderMessages(scroll);renderComposer();$('terminal-content').innerHTML=`<span class="prompt">~ $</span> cd ~/rhmdir\n<span class="prompt">~/rhmdir $</span> pwd\n/data/data/com.rhmapp/files/home/rhmdir\n\n<span class="prompt">~/rhmdir $</span> ls\n${files.filter(f=>f.ready).map(f=>esc(f.name)).join('\n')}\n\n<span class="prompt">~/rhmdir $</span> ▍`;}
function newSession(){const s={id:uid(),title:'新对话',group:'今天',time:'刚刚',draft:'',pending:[],pinned:false,messages:[]};sessions.unshift(s);activeId=s.id;tab='chat';closeOverlay(false);render(true);$('message-input').focus();}
function switchSession(id){if(!sessions.some(s=>s.id===id))return;activeId=id;tab='chat';closeOverlay(false);render(true);}
function closeOverlay(restore=true){$('overlay-root').innerHTML='';if(restore&&overlayReturn?.isConnected)overlayReturn.focus();}
function showOverlay(html,kind='sheet'){if(!$('overlay-root').firstChild)overlayReturn=document.activeElement;$('overlay-root').innerHTML=`<div class="overlay ${kind==='sheet'?'sheet-overlay':''}" id="overlay"><section class="${kind==='sheet'?'sheet':'drawer'}" role="dialog" aria-modal="true" aria-label="${kind==='sheet'?'文件与对话操作':'聊天历史'}">${kind==='sheet'?'<div class="grabber"></div>':''}${html}</section></div>`;const focus=$('overlay').querySelector('input,button');if(focus)focus.focus();}
function historyRow(s){return `<div class="swipe-row" data-id="${esc(s.id)}"><div class="swipe-actions" aria-hidden="true"><button class="swipe-action rename" data-action="row-rename" data-id="${esc(s.id)}">${icon('edit')}重命名</button><button class="swipe-action pin" data-action="row-pin" data-id="${esc(s.id)}">${icon('pin')}${s.pinned?'取消置顶':'置顶'}</button><button class="swipe-action del" data-action="row-delete" data-id="${esc(s.id)}">${icon('trash')}删除</button></div><button class="history-item ${s.id===activeId?'active':''}" data-action="switch" data-id="${esc(s.id)}" ${s.id===activeId?'aria-current="true"':''}>${icon(s.pinned?'pin':'chat')}<span class="hist-info"><strong>${esc(s.title)}</strong><small>${esc(s.time)} · ~/rhmdir</small></span>${jobs.has(s.id)?'<span class="live-dot" aria-label="正在回复"></span>':''}</button></div>`;}
function historyItems(query=''){const term=query.trim().toLowerCase();const list=sessions.filter(s=>s.title.toLowerCase().includes(term));const pinned=list.filter(s=>s.pinned),rest=list.filter(s=>!s.pinned);let html='';
  if(pinned.length)html+=`<div class="history-group">置顶</div>`+pinned.map(historyRow).join('');
  let group='';html+=rest.map(s=>{let prefix='';if(s.group!==group){group=s.group;prefix=`<div class="history-group">${esc(group)}</div>`;}return prefix+historyRow(s);}).join('');
  $('history-list').innerHTML=html||'<div class="empty-result">没有匹配的对话<br>换个关键词试试</div>';}
function openHistory(){showOverlay(`<div class="drawer-header"><span class="mini-brand">&gt;_</span><strong>对话历史</strong><button class="icon-btn" data-action="close" aria-label="关闭历史侧边栏">${icon('close')}</button></div><label class="search-box">${icon('search')}<input id="history-search" aria-label="搜索聊天历史" placeholder="搜索对话"></label><div class="history-list" id="history-list"></div><div class="drawer-foot"><button class="drawer-settings" data-action="settings" aria-label="设置">${icon('settings')}</button></div>`,'drawer');historyItems();$('history-search').addEventListener('input',e=>historyItems(e.target.value));}
function sheetTitle(title){return `<div class="sheet-title"><h3>${esc(title)}</h3><button class="icon-btn" data-action="close" aria-label="关闭面板">${icon('close')}</button></div>`;}
function openAttach(){showOverlay(sheetTitle('添加附件')+`<button class="sheet-action" data-action="choose"><span class="action-icon">${icon('upload')}</span><span><strong>从设备选择文件</strong><small>支持多选 · 单个 20 MB 以内</small></span>${icon('arrow')}</button><button class="sheet-action" data-action="files"><span class="action-icon">${icon('folder')}</span><span><strong>从 rhmdir 选择</strong><small>引用已有文件，不重复上传</small></span>${icon('arrow')}</button><button class="sheet-action" data-action="sample"><span class="action-icon">${icon('file')}</span><span><strong>试用一份示例文件</strong><small>不用选择本地文件，也能体验上传流程</small></span>${icon('arrow')}</button><p class="privacy">文件放在 ~/rhmdir，聊天和终端共用同一份。</p>`);}
function openFiles(){const rows=files.filter(f=>f.ready).map(f=>`<div class="file-row"><button class="file-main" data-action="preview" data-id="${esc(f.id)}">${fileGlyph(f)}<span class="file-copy"><strong>${esc(f.name)}</strong><small>${bytes(f.size)} · ${esc(f.source)}</small></span></button><button class="icon-btn" data-action="reference" data-id="${esc(f.id)}" aria-label="引用 ${esc(f.name)}">${icon('plus')}</button></div>`).join('');showOverlay(sheetTitle('工作区文件')+`<div class="directory-path">${icon('folder')} ~/rhmdir <button data-action="copy-path" aria-label="复制工作区路径">${icon('copy')}</button></div><div class="sheet-scroll"><div class="file-list">${rows||'<div class="empty-result">文件夹还是空的<br>上传第一份资料吧</div>'}</div></div><button class="primary" data-action="choose">${icon('upload')}上传文件到 rhmdir</button><p class="privacy">这是所有对话共享的文件夹，不按会话隔离。</p>`);}
function reference(id){const s=active(),f=findFile(id);if(!f?.ready)return;if(!s.pending.includes(id))s.pending.push(id);tab='chat';closeOverlay();render();toast(`已附加 ${f.name}`);}
function uniqueName(name){let cleaned=name.split(/[\\/]/).pop().trim()||'未命名文件';const i=cleaned.lastIndexOf('.');const base=i>0?cleaned.slice(0,i):cleaned,ext=i>0?cleaned.slice(i):'';let n=2,result=cleaned;while(files.some(f=>f.name===result))result=`${base} (${n++})${ext}`;return result;}
function addFiles(incoming,sessionId=activeId){const owner=sessions.find(s=>s.id===sessionId);if(!owner){toast('目标对话已不存在，请重新选择文件');return;}let accepted=0;for(const raw of incoming){if(raw.size>20*1024*1024){toast(`${raw.name} 超过 20 MB，未加入`);continue;}const renamed=uniqueName(raw.name);const file={id:uid(),name:renamed,size:raw.size,type:raw.type||'application/octet-stream',ready:false,source:raw.demo?'示例文件':'本地文件',raw:raw.demo?null:raw,content:raw.demo?raw.content:undefined};files.push(file);owner.pending.push(file.id);accepted++;setTimeout(()=>{if(!files.includes(file))return;file.ready=true;render(false);if($('history-list'))historyItems($('history-search').value);},650);}
  if(accepted){closeOverlay(false);tab='chat';render();if(owner.id!==activeId)toast(`文件已附到「${owner.title}」草稿`);}}
async function preview(id){const f=findFile(id);if(!f)return;showOverlay(sheetTitle(f.name)+`<div class="directory-path">~/rhmdir/${esc(f.name)}</div><div class="preview-content" id="preview-body">正在读取预览…</div><p class="sheet-text">${bytes(f.size)} · ${esc(f.source)}</p><div class="sheet-buttons"><button class="secondary" data-action="files">返回文件夹</button><button class="primary" data-action="reference" data-id="${esc(f.id)}">附到当前对话</button></div>`);let body=$('preview-body');body.dataset.fileId=id;
  if(f.content!==undefined){body.textContent=f.content;return;}
  if(f.raw&&['image/png','image/jpeg','image/gif','image/webp'].includes(f.type)){const img=document.createElement('img');img.alt=f.name;img.className='preview-image';const url=URL.createObjectURL(f.raw);objectUrls.push(url);img.src=url;body.replaceChildren(img);return;}
  if(f.raw&&f.size<=256*1024&&(/\.(txt|md|csv|json|log|py|js|ts|html|css|xml|yaml|yml)$/i.test(f.name)||f.type.startsWith('text/'))){try{const text=await f.raw.text();if($('preview-body')?.dataset.fileId===id)$('preview-body').textContent=text||'空文件';}catch{if($('preview-body')?.dataset.fileId===id)$('preview-body').textContent='无法预览这个文件，可以直接作为附件引用。';}return;}
  body.textContent='这个格式暂不预览，可以直接附到对话里。';
}
const themeNames={indigo:'黛蓝',teal:'松绿',clay:'赭陶',graphite:'石墨'};
function openSettings(){showOverlay(sheetTitle('设置')+`<div class="settings-group"><div class="settings-label">外观</div><div class="settings-row"><div><strong>颜色模式</strong><small>跟随系统或手动切换</small></div><div class="seg" role="group" aria-label="颜色模式"><button data-action="mode-set" data-mode="light" aria-label="浅色模式">${icon('sun')}</button><button data-action="mode-set" data-mode="dark" aria-label="深色模式">${icon('moon')}</button><button data-action="mode-set" data-mode="system" aria-label="跟随系统">${icon('monitor')}</button></div></div><div class="settings-row"><div><strong>主题色</strong><small id="theme-name">${themeNames[appearance.theme]}</small></div><div class="swatches" role="group" aria-label="主题色"><button class="swatch" data-action="theme-set" data-theme="indigo" aria-label="黛蓝"></button><button class="swatch" data-action="theme-set" data-theme="teal" aria-label="松绿"></button><button class="swatch" data-action="theme-set" data-theme="clay" aria-label="赭陶"></button><button class="swatch" data-action="theme-set" data-theme="graphite" aria-label="石墨"></button></div></div></div><div class="settings-group"><div class="settings-label">关于</div><div class="settings-row"><div><strong>版本</strong></div><span class="settings-value">0.1.0 · 原型</span></div><div class="settings-row"><div><strong>工作区</strong></div><span class="settings-value mono">~/rhmdir</span></div></div>`);document.querySelector('.sheet')?.classList.add('settings-sheet');applyAppearance();}
let menuTargetId=null;
function rename(){const s=sessions.find(x=>x.id===(menuTargetId||activeId));if(!s)return;showOverlay(sheetTitle('重命名对话')+`<label class="sr-only" for="rename-input">对话标题</label><input class="rename-input" id="rename-input" maxlength="60" value="${esc(s.title)}"><div class="sheet-buttons"><button class="secondary" data-action="close">取消</button><button class="primary" data-action="rename-save">保存</button></div>`);$('rename-input').select();}
function deleteConfirm(){showOverlay(sheetTitle('删除这段对话？')+'<p class="sheet-text">对话将从列表中移除，~/rhmdir 里的文件不受影响。</p><div class="sheet-buttons"><button class="secondary" data-action="close">取消</button><button class="primary" data-action="delete">确认删除</button></div>');}
/* iOS 风格左滑快捷操作 + 长按菜单 */
const SWIPE_WIDTH=186;
let swipe=null,longPressTimer=null,ignoreClickUntil=0;
function endSwipe(){clearTimeout(longPressTimer);swipe=null;}
function closeSwipes(except){document.querySelectorAll('.swipe-row.open').forEach(r=>{if(r!==except){r.classList.remove('open');const it=r.querySelector('.history-item');if(it)it.style.transform='';}});}
document.addEventListener('pointerdown',e=>{
  if(e.button&&e.button!==0)return;
  const row=e.target.closest('#overlay .swipe-row');if(!row)return;
  const item=row.querySelector('.history-item');if(!item)return;
  swipe={row,item,startX:e.clientX,startY:e.clientY,axis:null,moved:false,open:row.classList.contains('open')};
  clearTimeout(longPressTimer);
  longPressTimer=setTimeout(()=>{if(swipe&&!swipe.moved){ignoreClickUntil=Date.now()+400;closeSwipes(row);row.classList.add('open');endSwipe();}},420);
});
document.addEventListener('pointermove',e=>{
  if(!swipe)return;
  const dx=e.clientX-swipe.startX,dy=e.clientY-swipe.startY;
  if(!swipe.axis&&(Math.abs(dx)>6||Math.abs(dy)>6))swipe.axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
  if(swipe.axis!=='x'){if(swipe.axis==='y')clearTimeout(longPressTimer);return;}
  clearTimeout(longPressTimer);
  swipe.moved=true;
  const base=swipe.open?-SWIPE_WIDTH:0;
  const x=Math.max(-SWIPE_WIDTH,Math.min(0,base+dx));
  swipe.row.classList.add('dragging');
  swipe.item.style.transform=`translateX(${x}px)`;
});
document.addEventListener('pointerup',e=>{
  if(!swipe)return;
  const {row,item,startX,open,moved}=swipe;
  row.classList.remove('dragging');
  if(moved){
    ignoreClickUntil=Date.now()+350;
    const dx=e.clientX-startX;
    const shouldOpen=open?dx<70:dx<-70;
    closeSwipes(row);
    row.classList.toggle('open',shouldOpen);
    item.style.transform='';
  }
  endSwipe();
});
document.addEventListener('pointercancel',()=>{if(swipe){swipe.row.classList.remove('dragging');endSwipe();}});
function send(){const s=active();if(jobs.has(s.id)){clearInterval(jobs.get(s.id).timer);jobs.delete(s.id);const m=s.messages[s.messages.length-1];m.streaming=false;m.text+=(m.text?'\n\n':'')+'已停止。';render(true);return;}const text=s.draft.trim();if(!text&&!s.pending.length||s.pending.some(id=>!findFile(id)?.ready))return;const ids=[...s.pending];s.messages.push({role:'user',text:text||'请看看这些文件。',files:ids});if(s.title==='新对话')s.title=(text||(findFile(ids[0])?.name||'文件对话')).slice(0,22);s.time='刚刚';s.group='今天';s.draft='';s.pending=[];sessions=sessions.filter(x=>x!==s);sessions.unshift(s);const m={role:'assistant',text:'',streaming:true};s.messages.push(m);
  const reply=ids.length?`文件放到 ~/rhmdir 了：\n\n${ids.map(id=>'· ~/rhmdir/'+findFile(id).name).join('\n')}\n\n接下来我会在这个目录里读它们。`:`好，我接着「${s.title}」这条继续。`;
  let count=0;const timer=setInterval(()=>{count+=5;m.text=reply.slice(0,count);if(count>=reply.length){m.streaming=false;clearInterval(timer);jobs.delete(s.id);}if(activeId===s.id)render(true);if($('history-list'))historyItems($('history-search').value);},35);jobs.set(s.id,{timer});render(true);
}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('已复制');}catch{toast('浏览器未允许剪贴板访问');}}
const actions={history:openHistory,attach:openAttach,files:openFiles,new:newSession,close:()=>closeOverlay(),switch:b=>{const row=b.closest('.swipe-row');if(row?.classList.contains('open')){row.classList.remove('open');b.style.transform='';return;}switchSession(b.dataset.id);},chat:()=>{tab='chat';render();},terminal:()=>{tab='terminal';render();},choose:()=>{uploadTo=activeId;$('file-input').value='';$('file-input').click();},sample:()=>addFiles([{name:'需求说明.md',size:180,type:'text/markdown',demo:true,content:'# 一份新的需求\n\n这是模拟上传的示例文件。\n同名时自动增加序号，不覆盖旧文件。\n文件进入 rhmdir 后，可被不同会话引用。'}]),preview:b=>preview(b.dataset.id),reference:b=>reference(b.dataset.id),detach:b=>{active().pending=active().pending.filter(id=>id!==b.dataset.id);renderComposer();toast('已移除附件，文件仍在 rhmdir');},'row-rename':b=>{menuTargetId=b.dataset.id;rename();},'row-pin':b=>{const s=sessions.find(x=>x.id===b.dataset.id);if(!s)return;const inSheet=!!document.querySelector('.sheet');s.pinned=!s.pinned;if(inSheet){closeOverlay();render();}else historyItems($('history-search').value);toast(s.pinned?'已置顶':'已取消置顶');},'row-delete':b=>{menuTargetId=b.dataset.id;deleteConfirm();},settings:openSettings,'mode-set':b=>{appearance.mode=b.dataset.mode;localStorage.setItem('rhm.mode',appearance.mode);applyAppearance();},'theme-set':b=>{appearance.theme=b.dataset.theme;localStorage.setItem('rhm.theme',appearance.theme);applyAppearance();const name=$('theme-name');if(name)name.textContent=themeNames[appearance.theme];},'rename-save':()=>{const s=sessions.find(x=>x.id===(menuTargetId||activeId));const title=$('rename-input').value.trim();if(!title){toast('标题不能为空');return;}if(s)s.title=title;closeOverlay();render();},'delete-confirm':deleteConfirm,delete:()=>{const id=menuTargetId||activeId;if(jobs.has(id)){clearInterval(jobs.get(id).timer);jobs.delete(id);}sessions=sessions.filter(s=>s.id!==id);if(!sessions.length){newSession();toast('已删除对话，文件仍然保留');return;}if(id===activeId)activeId=sessions[0].id;closeOverlay();render(true);toast('已删除对话，文件仍然保留');},'copy-path':()=>copyText('~/rhmdir'),'copy-message':b=>copyText(active().messages[Number(b.dataset.index)].text),suggest:()=>{active().draft='帮我规划一下今天的任务';renderComposer();$('message-input').focus();},reset:()=>{seed();toast('已还原演示数据');}};
document.addEventListener('click',e=>{if(Date.now()<ignoreClickUntil)return;if(e.target.id==='overlay'){closeOverlay();return;}const b=e.target.closest('[data-action]');if(b&&!b.disabled)actions[b.dataset.action]?.(b);});
$('composer').addEventListener('submit',e=>{e.preventDefault();send();});
$('message-input').addEventListener('input',e=>{active().draft=e.target.value;renderComposer();});
$('message-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();}});
$('file-input').addEventListener('change',e=>{addFiles([...e.target.files],uploadTo||activeId);uploadTo=null;});
document.addEventListener('keydown',e=>{const modal=$('overlay');if(!modal)return;if(e.key==='Escape'){closeOverlay();return;}if(e.key==='Tab'){const nodes=[...modal.querySelectorAll('button:not(:disabled),input,textarea,[tabindex="0"]')];const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
hydrateIcons();applyAppearance();seed();
</script>
